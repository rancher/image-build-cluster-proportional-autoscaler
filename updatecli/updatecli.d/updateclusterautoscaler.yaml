---
name: "Update autoscaler version" 

sources:
 autoscaler:
   name: Get autoscaler version
   kind: gittag
   scmid: upstream
   spec:
     versionfilter:
       kind: regex
       pattern: '^v\d+\.\d+\.\d+$'

targets:
  tagfile:
    name: "Bump to latest autoscaler version in TAG"
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: TAG
      matchpattern: '(?m)^(.+)$'
      replacepattern: '{{ source "autoscaler" }}'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

  upstream:
    kind: github
    spec:
      owner: "kubernetes-sigs"
      repository: "cluster-proportional-autoscaler"
      branch: "master"
      token: '{{ requiredEnv .github.token }}'

actions:
  default:
    title: 'Bump autoscaler version to {{ source "autoscaler" }}'
    kind: github/pullrequest
    spec:
      merge:
        strategy: auto
      labels:
      - updatecli
    scmid: default

